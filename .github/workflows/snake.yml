name: Generate Snake Animation

on:
  schedule:
    # Runs every 12 hours to keep the snake fresh
    - cron: "0 */12 * * *"
  # Run manually from the Actions tab
  workflow_dispatch:
  # Run on every push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#b026ff&color_dots=#161b22,#0d3a5c,#15629b,#1e8ad0,#00e5ff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
